server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/html text/css application/javascript text/xml application/json;
    gzip_min_length 1024;

    location ~* \.(html|css|js|ico|svg|png|jpg|webp|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
