server {
    listen 80;
    root  /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json
               application/javascript text/xml text/javascript image/svg+xml;

    # El bundle se construyó con base:'/login/' (Vite) — todas las
    # referencias JS/CSS/manifest ya vienen con ese prefijo. `alias`
    # lo despoja antes de buscar el archivo físico (que vive en la
    # raíz del contenedor, sin subcarpeta /login).
    location /login/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ index.html =404;
    }

    location = /login {
        return 301 /login/;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        return 301 /login/;
    }
}
